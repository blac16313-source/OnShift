<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Templates - OnShift</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>html,body{overflow-x:hidden}.active-filter{background:white;color:black!important}</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<header class="sticky top-0 z-50 bg-[#0a0a0a] border-b border-white/10">
<div class="max-w-[1400px] mx-auto px-5 h-[60px] flex items-center justify-between">
<a href="index.html" class="font-black text-[20px]">OnShift.</a>
<a href="index.html" class="border border-white/20 px-4 py-2 text-[10px] font-bold">HOME</a>
</div>
</header>
<section class="max-w-[1400px] mx-auto px-5 pt-10 pb-6">
<h1 class="text-[40px] font-black leading-[0.9]">ALL<br>TEMPLATES</h1>
<div class="mt-8 flex gap-2 overflow-x-auto pb-2">
<button onclick="filterT('all')" id="f-all" class="active-filter px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest">ALL</button>
<button onclick="filterT('shoe')" id="f-shoe" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">SHOE STORE</button>
<button onclick="filterT('phone')" id="f-phone" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">PHONE STORE</button>
<button onclick="filterT('electronic')" id="f-electronic" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">ELECTRONIC</button>
<button onclick="filterT('clothes')" id="f-clothes" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">CLOTHES</button>
<button onclick="filterT('kirana')" id="f-kirana" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">KIRANA</button>
</div>
</section>
<section class="max-w-[1400px] mx-auto px-5 pb-20">
<div id="grid" class="grid md:grid-cols-3 gap-[1px] bg-white/10 border border-white/10"></div>
</section>

<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1iZUkVkq8JkRWEehmfDa4ustz-7RzAqjL_moNoZrzjT0/export?format=csv";

let templates = [
{id:'shoe',cat:'shoe',name:'SHOE STORE',icon:'ri-store-3-line',desc:'WhatsApp + COD + Size', link:'https://starlit-raindrop-5ccede.netlify.app', live:true},
{id:'phone',cat:'phone',name:'PHONE STORE',icon:'ri-smartphone-line',desc:'IMEI + Combo + Exchange', link:'template-view.html?id=phone', live:false},
{id:'electronic',cat:'electronic',name:'ELECTRONIC STORE',icon:'ri-computer-line',desc:'Warranty + Specs + EMI', link:'template-view.html?id=electronic', live:false},
{id:'clothes',cat:'clothes',name:'CLOTHES STORE',icon:'ri-t-shirt-line',desc:'Size + Color + Lookbook', link:'template-view.html?id=clothes', live:false},
{id:'kirana',cat:'kirana',name:'KIRANA STORE',icon:'ri-shopping-basket-line',desc:'Weight + Daily Delivery', link:'template-view.html?id=kirana', live:false},
{id:'jewel',cat:'clothes',name:'JEWELLERY STORE',icon:'ri-vip-diamond-line',desc:'Gold + Try On + Hallmark', link:'template-view.html?id=jewel', live:false},
];

function render(list){
document.getElementById('grid').innerHTML = list.map(t=>{
  const badge = t.live? `<span class="absolute top-3 right-3 bg-white text-black text-[9px] font-black px-2 py-1">LIVE</span>` : `<span class="absolute top-3 right-3 bg-white/10 text-white/50 text-[9px] font-bold px-2 py-1">SOON</span>`;
  return `<a href="${t.link}" target="${t.live?'_blank':'_self'}" class="bg-[#111] p-5 group relative block">
  ${badge}
  <div class="bg-white aspect-[4/3] flex items-center justify-center text-black"><i class="${t.icon} text-4xl"></i></div>
  <div class="mt-4 flex justify-between"><div><p class="text-[10px] text-white/30">${t.cat.toUpperCase()}</p><p class="font-bold mt-1">${t.name}</p></div><i class="ri-arrow-right-up-line text-white/20 group-hover:text-white"></i></div>
  <p class="mt-2 text-[11px] text-white/30">${t.desc}</p>
  </a>`;
}).join('');
}

function filterT(cat){
document.querySelectorAll('[id^=f-]').forEach(b=>{b.classList.remove('active-filter'); b.classList.add('text-white/50')});
document.getElementById('f-'+cat).classList.add('active-filter');
document.getElementById('f-'+cat).classList.remove('text-white/50');
if(cat==='all') render(templates);
else render(templates.filter(t=>t.cat===cat));
}

// initial render immediately - so page is never blank like your screenshot
render(templates);

// then try to overwrite shoe link from sheet - this is your future proof part
fetch(SHEET_CSV).then(r=>r.text()).then(csv=>{
  const rows = csv.split("\n");
  for(let i=1;i<rows.length;i++){
    let cols = rows[i].split(",");
    let cat = (cols[2]||"").toLowerCase();
    let link = cols.slice(3).join(",").replace(/"/g,"").trim();
    if(link.startsWith("http") && (cat.includes("shoe") || cat.includes("foot"))){
      templates[0].link = link;
      templates[0].live = true;
      render(templates);
      console.log("Updated shoe link from sheet:", link);
    }
  }
}).catch(()=>{ console.log("Sheet blocked, using hardcoded link"); });
</script>
</body>
</html>
