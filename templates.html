<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Templates - OnShift</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
<style>html,body{overflow-x:hidden}.active-filter{background:white;color:black!important}</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<header class="sticky top-0 z-50 bg-[#0a0a0a] border-b border-white/10">
<div class="max-w-[1400px] mx-auto px-5 h-[60px] flex items-center justify-between">
<a href="index.html" class="font-black text-[20px]">OnShift.</a>
<a href="index.html" class="border border-white/20 px-4 py-2 text-[10px] font-bold">HOME</a>
</div>
</header>
<section class="max-w-[1400px] mx-auto px-5 pt-10 pb-6">
<h1 class="text-[40px] font-black leading-[0.9]">ALL<br>TEMPLATES</h1>
<div class="mt-8 flex gap-2 overflow-x-auto pb-2">
<button onclick="filterT('all')" id="f-all" class="active-filter px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest">ALL</button>
<button onclick="filterT('shoe')" id="f-shoe" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">SHOE STORE</button>
<button onclick="filterT('phone')" id="f-phone" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">PHONE STORE</button>
<button onclick="filterT('electronic')" id="f-electronic" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">ELECTRONIC</button>
<button onclick="filterT('clothes')" id="f-clothes" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">CLOTHES</button>
<button onclick="filterT('kirana')" id="f-kirana" class="px-5 py-2 border border-white/20 text-[11px] font-bold tracking-widest text-white/50">KIRANA</button>
</div>
</section>
<section class="max-w-[1400px] mx-auto px-5 pb-20">
<div id="grid" class="grid md:grid-cols-3 gap-[1px] bg-white/10 border border-white/10">
<div class="bg-[#111] p-10 text-center text-white/30 text-[11px]">READING YOUR SHEET...</div>
</div>
</section>

<script>
// THIS IS YOUR SHEET LINK - NOT WEBSITE LINK
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/1iZUkVkq8JkRWEehmfDa4ustz-7RzAqjL_moNoZrzjT0/export?format=csv";

const ICONS = {
  shoe: "ri-store-3-line",
  footwear: "ri-store-3-line",
  phone: "ri-smartphone-line",
  electronic: "ri-computer-line",
  clothes: "ri-t-shirt-line",
  kirana: "ri-shopping-basket-line"
};

let allData = [];

async function loadFromSheet(){
  try{
    const res = await fetch(SHEET_CSV);
    const csv = await res.text();
    const rows = csv.trim().split("\n");
    allData = [];
    for(let i=1;i<rows.length;i++){
      if(!rows[i].trim()) continue;
      // split but keep link with commas safe
      let cols = rows[i].split(",");
      if(cols.length < 4) continue;
      let arch = cols[0].replace(/"/g,"").trim();
      let name = cols[1].replace(/"/g,"").trim();
      let cat = cols[2].replace(/"/g,"").toLowerCase().trim();
      let link = cols.slice(3).join(",").replace(/"/g,"").trim();
      if(!link.startsWith("http")) continue;

      // normalize cat for filter: footwear -> shoe
      let filterCat = cat;
      if(cat.includes("foot") || cat.includes("shoe")) filterCat = "shoe";
      if(cat.includes("phone")) filterCat = "phone";
      if(cat.includes("electronic")) filterCat = "electronic";
      if(cat.includes("cloth")) filterCat = "clothes";
      if(cat.includes("kirana")) filterCat = "kirana";

      allData.push({ arch, name, cat: filterCat, rawCat: cat, link });
    }
    render(allData);
  }catch(e){
    document.getElementById('grid').innerHTML = `<div class="bg-[#111] p-10 text-red-400">Sheet not readable. Make sure Anyone with link - Viewer is ON. Error: ${e}</div>`;
  }
}

function render(list){
  document.getElementById('grid').innerHTML = list.map(t=>{
    const icon = ICONS[t.cat] || "ri-layout-line";
    return `<a href="${t.link}" target="_blank" class="bg-[#111] p-5 group relative block">
      <span class="absolute top-3 right-3 bg-white text-black text-[9px] font-black px-2 py-1">${t.arch} LIVE</span>
      <div class="bg-white aspect-[4/3] flex items-center justify-center text-black"><i class="${icon} text-4xl"></i></div>
      <div class="mt-4 flex justify-between"><div><p class="text-[10px] text-white/30">${t.rawCat.toUpperCase()}</p><p class="font-bold mt-1">${t.name.toUpperCase()}</p></div><i class="ri-arrow-right-up-line text-white/20 group-hover:text-white"></i></div>
      <p class="mt-2 text-[11px] text-white/30">${t.link.replace('https://','').substring(0,30)}</p>
    </a>`;
  }).join('');
}

function filterT(cat){
  document.querySelectorAll('[id^=f-]').forEach(b=>{b.classList.remove('active-filter'); b.classList.add('text-white/50')});
  document.getElementById('f-'+cat).classList.add('active-filter');
  document.getElementById('f-'+cat).classList.remove('text-white/50');
  if(cat==='all') render(allData);
  else render(allData.filter(t=>t.cat===cat));
}

loadFromSheet();
</script>
</body>
</html>
