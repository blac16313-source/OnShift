<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Product — NOIR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f5f1;
  color:#111;
}

/* HEADER */

header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:24px;
  font-weight:700;
  letter-spacing:4px;
}

.back{
  font-size:13px;
  text-decoration:none;
  color:#111;
}


/* PRODUCT PAGE */

.container{
  max-width:1200px;
  margin:70px auto;
  padding:0 30px;
}

.product{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:start;
}

.product-image{
  width:100%;
  aspect-ratio:4 / 5;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding-top:20px;
}

.category{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#777;
  margin-bottom:18px;
}

.name{
  font-size:52px;
  line-height:1.05;
  letter-spacing:-3px;
  font-weight:500;
  margin-bottom:20px;
}

.price{
  font-size:20px;
  margin-bottom:35px;
}

.description{
  max-width:500px;
  color:#555;
  font-size:15px;
  line-height:1.8;
  margin-bottom:40px;
}

.cart-button{
  width:100%;
  max-width:500px;
  padding:17px;
  border:none;
  background:#111;
  color:#fff;
  font-size:13px;
  letter-spacing:1px;
  cursor:pointer;
}

.cart-button:hover{
  background:#333;
}


/* LOADING */

.loading{
  text-align:center;
  padding:120px 20px;
  font-size:13px;
  letter-spacing:1px;
  color:#777;
}


/* ERROR */

.error{
  display:none;
  text-align:center;
  padding:120px 20px;
}

.error h1{
  font-size:42px;
  letter-spacing:-2px;
  margin-bottom:15px;
}

.error p{
  color:#777;
  margin-bottom:25px;
}

.error a{
  color:#111;
  font-size:13px;
}


/* MOBILE */

@media(max-width:750px){

  header{
    height:68px;
    padding:0 5%;
  }

  .logo{
    font-size:20px;
  }

  .container{
    margin:35px auto;
    padding:0 20px;
  }

  .product{
    grid-template-columns:1fr;
    gap:35px;
  }

  .product-info{
    padding-top:0;
  }

  .name{
    font-size:40px;
    letter-spacing:-2px;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    NOIR
  </div>

  <a href="shop.html" class="back">
    ← Back to Shop
  </a>

</header>


<div class="container">

  <!-- LOADING -->

  <div id="loading" class="loading">
    LOADING PRODUCT...
  </div>


  <!-- PRODUCT -->

  <div
    id="product"
    class="product"
    style="display:none;"
  >

    <div>

      <img
        id="productImage"
        class="product-image"
        alt="Product"
      >

    </div>


    <div class="product-info">

      <div
        id="category"
        class="category"
      ></div>

      <h1
        id="name"
        class="name"
      ></h1>

      <div
        id="price"
        class="price"
      ></div>

      <p
        id="description"
        class="description"
      ></p>

      <button
        id="cartButton"
        class="cart-button"
      >
        ADD TO CART
      </button>

    </div>

  </div>


  <!-- ERROR -->

  <div
    id="error"
    class="error"
  >

    <h1>
      Product not found
    </h1>

    <p>
      This product could not be loaded.
    </p>

    <a href="shop.html">
      ← Return to Shop
    </a>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://ktiovexnefqrgybkgpwi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_2iKjHaxlnmTPKE1VrZCdQw_gjj6K5x3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==============================
   GET PRODUCT ID
============================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const productId =
  params.get("id");


/* ==============================
   ELEMENTS
============================== */

const loading =
  document.getElementById("loading");

const productBox =
  document.getElementById("product");

const errorBox =
  document.getElementById("error");

const productImage =
  document.getElementById("productImage");

const category =
  document.getElementById("category");

const name =
  document.getElementById("name");

const price =
  document.getElementById("price");

const description =
  document.getElementById("description");

const cartButton =
  document.getElementById("cartButton");


/* ==============================
   LOAD PRODUCT
============================== */

async function loadProduct(){

  if(!productId){

    showError();

    return;
  }


  try{

    const result =
      await supabaseClient
      .from("store")
      .select("*")
      .eq("id", productId)
      .eq("store_id", "noir")
      .single();


    if(result.error){

      throw result.error;

    }


    const product =
      result.data;


    if(!product){

      showError();

      return;
    }


    /* PRODUCT IMAGE */

    productImage.src =
      product.image_url;

    productImage.alt =
      product.name || "Product";


    /* PRODUCT DETAILS */

    name.textContent =
      product.name || "Untitled Product";

    category.textContent =
      product.category || "";

    price.textContent =
      "₹" +
      Number(product.price || 0)
      .toLocaleString("en-IN");

    description.textContent =
      product.description ||
      "No description available.";


    /* SHOW */

    loading.style.display =
      "none";

    productBox.style.display =
      "grid";


    /* STORE PRODUCT FOR CART */

    window.currentProduct =
      product;


  }catch(error){

    console.error(
      "Product loading error:",
      error
    );

    showError();

  }

}


/* ==============================
   ERROR
============================== */

function showError(){

  loading.style.display =
    "none";

  productBox.style.display =
    "none";

  errorBox.style.display =
    "block";

}


/* ==============================
   ADD TO CART
============================== */

cartButton.addEventListener(
  "click",
  function(){

    if(!window.currentProduct){
      return;
    }


    const product =
      window.currentProduct;


    let cart =
      JSON.parse(
        localStorage.getItem("noir_cart")
      ) || [];


    const existing =
      cart.find(
        item =>
          String(item.id) ===
          String(product.id)
      );


    if(existing){

      existing.quantity += 1;

    }else{

      cart.push({

        id: product.id,

        name: product.name,

        price: product.price,

        image_url: product.image_url,

        quantity: 1

      });

    }


    localStorage.setItem(
      "noir_cart",
      JSON.stringify(cart)
    );


    cartButton.textContent =
      "ADDED TO CART";


    cartButton.style.background =
      "#333";


    setTimeout(function(){

      cartButton.textContent =
        "ADD TO CART";

      cartButton.style.background =
        "#111";

    },1500);

  }
);


/* ==============================
   START
============================== */

loadProduct();

</script>

</body>
</html>
