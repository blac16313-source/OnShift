<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop — NOIR</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f5f1;
  color:#111;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:24px;
  font-weight:700;
  letter-spacing:4px;
}

nav{
  display:flex;
  gap:30px;
  font-size:14px;
}

.cart{
  font-size:14px;
}

.page{
  padding:80px 6%;
}

.top{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:45px;
}

.top h1{
  font-size:clamp(45px,6vw,75px);
  letter-spacing:-4px;
}

.top p{
  color:#777;
  font-size:14px;
}

.filters{
  display:flex;
  gap:10px;
  margin-bottom:35px;
  flex-wrap:wrap;
}

.filter{
  border:1px solid #ccc;
  background:transparent;
  padding:10px 18px;
  font-size:12px;
  cursor:pointer;
}

.filter.active,
.filter:hover{
  background:#111;
  color:#fff;
  border-color:#111;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px 18px;
}

.product{
  cursor:pointer;
}

.image{
  aspect-ratio:3/4;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:11px;
  margin-bottom:14px;
  overflow:hidden;
}

.image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.name{
  font-size:14px;
  margin-bottom:7px;
}

.category{
  font-size:11px;
  color:#888;
  margin-bottom:7px;
}

.price{
  font-size:13px;
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#777;
  font-size:13px;
}

.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:70px;
}

.page-btn{
  width:40px;
  height:40px;
  border:1px solid #ccc;
  background:transparent;
  cursor:pointer;
}

.page-btn.active,
.page-btn:hover{
  background:#111;
  color:#fff;
  border-color:#111;
}

footer{
  margin-top:80px;
  background:#111;
  color:#777;
  padding:30px 6%;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

@media(max-width:900px){

  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){

  header{
    padding:0 5%;
  }

  nav{
    display:none;
  }

  .page{
    padding:55px 5%;
  }

  .top{
    display:block;
  }

  .top p{
    margin-top:15px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:25px 12px;
  }

  footer{
    padding:25px 5%;
  }
}
</style>
</head>

<body>

<header>

  <a href="index.html" class="logo">NOIR</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="index.html#story">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <a href="#" class="cart">Cart (0)</a>

</header>


<main class="page">

  <div class="top">

    <div>
      <h1>Shop</h1>
    </div>

    <p>Explore the latest NOIR collection.</p>

  </div>


  <div class="filters">

    <button class="filter active" data-category="All">
      All
    </button>

    <button class="filter" data-category="Shirts">
      Shirts
    </button>

    <button class="filter" data-category="T-Shirts">
      T-Shirts
    </button>

    <button class="filter" data-category="Trousers">
      Trousers
    </button>

    <button class="filter" data-category="Jackets">
      Jackets
    </button>

    <button class="filter" data-category="Accessories">
      Accessories
    </button>

  </div>


  <div class="products" id="products">

    <div class="loading">
      Loading products...
    </div>

  </div>


  <div class="pagination">

    <button class="page-btn active">1</button>

  </div>

</main>


<footer id="contact">

  <span>© 2026 NOIR</span>

  <span>Instagram · WhatsApp · Contact</span>

</footer>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://ktiovexnefqrgybkgpwi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_2iKjHaxlnmTPKE1VrZCdQw_gjj6K5x3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==============================
   ELEMENTS
============================== */

const productsContainer =
  document.getElementById("products");

const filters =
  document.querySelectorAll(".filter");


/* ==============================
   PRODUCTS
============================== */

let allProducts = [];


/* ==============================
   LOAD PRODUCTS
============================== */

async function loadProducts(){

  try{

    const result =
      await supabaseClient
      .from("store")
      .select("*")
      .eq("store_id","noir")
      .order("created_at",{ascending:false});


    if(result.error){
      throw result.error;
    }


    allProducts =
      result.data || [];


    renderProducts(
      allProducts
    );


  }catch(error){

    console.error(
      "Product loading error:",
      error
    );

    productsContainer.innerHTML =
      '<div class="error">Unable to load products.</div>';

  }

}


/* ==============================
   RENDER PRODUCTS
============================== */

function renderProducts(products){

  productsContainer.innerHTML = "";


  if(!products.length){

    productsContainer.innerHTML =
      '<div class="empty">No products available.</div>';

    return;
  }


  products.forEach(function(product){

    const card =
      document.createElement("div");

    card.className =
      "product";


    /* IMAGE */

    const image =
      document.createElement("div");

    image.className =
      "image";


    if(product.image_url){

      const img =
        document.createElement("img");

      img.src =
        product.image_url;

      img.alt =
        product.name || "NOIR Product";

      image.appendChild(img);

    }else{

      image.textContent =
        "PRODUCT IMAGE";

    }


    /* CATEGORY */

    const category =
      document.createElement("div");

    category.className =
      "category";

    category.textContent =
      product.category || "";


    /* NAME */

    const name =
      document.createElement("div");

    name.className =
      "name";

    name.textContent =
      product.name || "Unnamed Product";


    /* PRICE */

    const price =
      document.createElement("div");

    price.className =
      "price";

    price.textContent =
      "₹" +
      Number(product.price || 0)
      .toLocaleString("en-IN");


    card.appendChild(image);
    card.appendChild(category);
    card.appendChild(name);
    card.appendChild(price);

    productsContainer.appendChild(card);

  });

}


/* ==============================
   FILTERS
============================== */

filters.forEach(function(button){

  button.addEventListener(
    "click",
    function(){

      filters.forEach(function(item){

        item.classList.remove(
          "active"
        );

      });


      button.classList.add(
        "active"
      );


      const selectedCategory =
        button.dataset.category;


      if(selectedCategory === "All"){

        renderProducts(
          allProducts
        );

        return;
      }


      const filteredProducts =
        allProducts.filter(
          function(product){

            return product.category ===
              selectedCategory;

          }
        );


      renderProducts(
        filteredProducts
      );

    }
  );

});


/* ==============================
   START
============================== */

loadProducts();

</script>

</body>
</html>
